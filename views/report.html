<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Report — CipherGate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="grid-overlay"></div>

<nav class="navbar">
  <div class="navbar-inner">
    <div class="brand"><div class="brand-mark">🛡</div> CipherGate</div>
    <div class="nav-links">
      <a href="/">Scan</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="dash-header">
    <div class="section-title" style="text-align:left; margin-bottom:2px;" id="report-website">—</div>
    <div class="section-sub" style="text-align:left;">Audited on <span id="report-date">—</span></div>
  </div>

  <div id="report-empty" class="glass empty-state" style="display:none; margin-bottom:30px;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div>No report data found. <a href="/">Run a new audit</a> to see results here.</div>
  </div>

  <div id="report-content" class="dash-grid" style="display:none;">
    <!-- Sidebar -->
    <div>
      <div class="glass score-ring-card">
        <div class="score-ring-wrap">
          <canvas id="score-ring" width="180" height="180"></canvas>
          <div class="score-value">
            <span class="num" id="score-num">—</span>
            <span class="max">/ 100</span>
          </div>
        </div>
        <div class="score-label" id="score-label">—</div>

        <div class="stat-row"><span>Total Checks</span><span id="stat-total">—</span></div>
        <div class="stat-row"><span>Passed</span><span id="stat-passed" style="color:var(--green)">—</span></div>
        <div class="stat-row"><span>Failed</span><span id="stat-failed" style="color:var(--red)">—</span></div>

        <div class="download-row">
          <a id="download-pdf" class="btn btn-primary btn-sm" href="#" download>Download PDF</a>
          <a id="download-json" class="btn btn-outline btn-sm" href="#" download>Download JSON</a>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div>
      <div class="glass card">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          Executive Summary
        </h2>
        <p id="report-summary" style="color:var(--text-dim); font-size:0.92rem; line-height:1.6; margin:0;">—</p>
      </div>

      <div id="module-pills" class="module-pill-row"></div>

      <div class="glass card">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Failed Checks
        </h2>
        <div id="failed-list"></div>
      </div>

      <div class="glass card">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          Passed Checks
        </h2>
        <div id="passed-list"></div>
      </div>
    </div>
  </div>

  <footer>CipherGate — built by <a href="https://github.com/mahesha8097" target="_blank" rel="noopener">@mahesha</a>. For authorized security testing only.</footer>
</div>

<script src="/js/report.js"></script>
</body>
</html>
